<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY Data Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        select {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            min-width: 200px;
        }
        
        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 NIFTY Data Viewer</h1>
        
        <div class="controls">
            <select id="indexSelect">
                <option value="">All Indices</option>
                <option value="NIFTY 50">NIFTY 50</option>
                <option value="NIFTY BANK">NIFTY BANK</option>
            </select>
            <select id="limitSelect">
                <option value="10">Last 10</option>
                <option value="25">Last 25</option>
                <option value="50">Last 50</option>
                <option value="100">Last 100</option>
            </select>
            <button onclick="loadData()">🔄 Refresh</button>
            <button onclick="window.open('http://localhost:8000/graphql', '_blank')">🔍 Open GraphQL</button>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <div id="loading" class="loading">Loading data...</div>
        <div id="error" class="error" style="display: none;"></div>
        <table id="dataTable" style="display: none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Date</th>
                    <th>Open</th>
                    <th>High</th>
                    <th>Low</th>
                    <th>Close</th>
                    <th>Source</th>
                </tr>
            </thead>
            <tbody id="dataBody"></tbody>
        </table>
    </div>
    
    <script>
        const GRAPHQL_URL = 'http://localhost:8000/graphql';
        
        async function loadData() {
            const indexName = document.getElementById('indexSelect').value;
            const limit = parseInt(document.getElementById('limitSelect').value);
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('dataTable').style.display = 'none';
            
            let query = `
                query {
                    niftyData(limit: ${limit}${indexName ? `, name: "${indexName}"` : ''}) {
                        name
                        date
                        open
                        high
                        low
                        close
                        importedAt
                    }
                    niftyDataCount
                }
            `;
            
            try {
                const response = await fetch(GRAPHQL_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                if (result.errors) {
                    throw new Error(result.errors[0].message);
                }
                
                const data = result.data.niftyData || [];
                displayData(data);
                displayStats(data);
                
            } catch (error) {
                document.getElementById('error').textContent = `Error: ${error.message}`;
                document.getElementById('error').style.display = 'block';
                console.error('Error:', error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayData(data) {
            const tbody = document.getElementById('dataBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No data found</td></tr>';
                document.getElementById('dataTable').style.display = 'table';
                return;
            }
            
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.name || 'N/A'}</td>
                    <td>${item.date}</td>
                    <td>${item.open ? item.open.toFixed(2) : 'N/A'}</td>
                    <td>${item.high ? item.high.toFixed(2) : 'N/A'}</td>
                    <td>${item.low ? item.low.toFixed(2) : 'N/A'}</td>
                    <td>${item.close ? item.close.toFixed(2) : 'N/A'}</td>
                    <td>${item.importedAt ? new Date(item.importedAt).toLocaleString() : 'N/A'}</td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('dataTable').style.display = 'table';
        }
        
        function displayStats(data) {
            const statsDiv = document.getElementById('stats');
            const nifty50 = data.filter(d => d.name === 'NIFTY 50');
            const niftyBank = data.filter(d => d.name === 'NIFTY BANK');
            
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <h3>Total Records</h3>
                    <div class="value">${data.length}</div>
                </div>
                <div class="stat-card">
                    <h3>NIFTY 50</h3>
                    <div class="value">${nifty50.length}</div>
                </div>
                <div class="stat-card">
                    <h3>NIFTY BANK</h3>
                    <div class="value">${niftyBank.length}</div>
                </div>
            `;
        }
        
        // Load data on page load
        window.onload = () => {
            loadData();
        };
    </script>
</body>
</html>
