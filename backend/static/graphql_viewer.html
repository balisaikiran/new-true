<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL Nifty Data Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        
        .tab {
            flex: 1;
            padding: 15px 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        
        .tab:hover {
            background: #e9ecef;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }
        
        .tab-content {
            display: none;
            padding: 30px;
            background: white;
        }
        
        .tab-content.active {
            display: block;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .results {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }
        
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
        }
        
        tbody tr:last-child td {
            border-bottom: none;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            flex: 1;
            min-width: 150px;
        }
        
        .stat-card .label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-top: 5px;
        }
        
        .query-presets {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .preset-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .preset-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        .mutation-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .delete-form {
            background: #fff3cd;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 GraphQL Nifty Data Manager</h1>
            <p>Query, Insert, Update, and Delete Nifty OHLC data</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('query')">🔍 Query Data</button>
            <button class="tab" onclick="switchTab('insert')">➕ Insert Data</button>
            <button class="tab" onclick="switchTab('delete')">🗑️ Delete Data</button>
        </div>
        
        <!-- Query Tab -->
        <div id="query-tab" class="tab-content active">
            <div class="query-section">
                <label for="query">GraphQL Query:</label>
                <textarea id="query" placeholder="Enter your GraphQL query here...">query {
  niftyData(limit: 10) {
    name
    date
    price
    open
    high
    low
    close
    volume
    changePercent
  }
}</textarea>
                <div class="form-row" style="margin-top: 12px;">
                    <div>
                        <label for="index-select">Index filter (optional)</label>
                        <select id="index-select">
                            <option value="">All</option>
                            <option value="NIFTY 50">NIFTY 50</option>
                            <option value="NIFTY BANK">NIFTY BANK</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="query-presets">
                <button class="preset-btn" onclick="setPreset('latest')">Latest 10 Records</button>
                <button class="preset-btn" onclick="setPreset('dateRange')">Date Range</button>
                <button class="preset-btn" onclick="setPreset('count')">Get Count</button>
                <button class="preset-btn" onclick="setPreset('singleDate')">Single Date</button>
            </div>
            
            <div class="button-group">
                <button class="btn-primary" onclick="executeQuery()">▶ Execute Query</button>
                <button class="btn-secondary" onclick="clearResults()">Clear Results</button>
            </div>
            
            <div class="results" id="results">
                <p style="text-align: center; color: #6c757d; padding: 40px;">
                    Enter a query and click "Execute Query" to see results
                </p>
            </div>
        </div>
        
        <!-- Insert Tab -->
        <div id="insert-tab" class="tab-content">
            <div class="mutation-form">
                <h2 style="margin-bottom: 20px; color: #495057;">Insert/Update Nifty Data</h2>
                
                <div class="form-row">
                    <div>
                        <label for="insert-date">Date * (YYYY-MM-DD)</label>
                        <input type="date" id="insert-date" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div>
                        <label for="insert-open">Open Price</label>
                        <input type="number" id="insert-open" step="0.01" placeholder="e.g., 26000.00">
                    </div>
                    <div>
                        <label for="insert-high">High Price</label>
                        <input type="number" id="insert-high" step="0.01" placeholder="e.g., 26100.00">
                    </div>
                    <div>
                        <label for="insert-low">Low Price</label>
                        <input type="number" id="insert-low" step="0.01" placeholder="e.g., 25900.00">
                    </div>
                    <div>
                        <label for="insert-close">Close Price</label>
                        <input type="number" id="insert-close" step="0.01" placeholder="e.g., 26050.00">
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn-success" onclick="upsertData()">💾 Upsert Data (Create or Update)</button>
                    <button class="btn-primary" onclick="createData()">➕ Create New (Fail if exists)</button>
                    <button class="btn-secondary" onclick="updateData()">✏️ Update Existing</button>
                    <button class="btn-secondary" onclick="clearInsertForm()">Clear Form</button>
                </div>
            </div>
            
            <div id="insert-results"></div>
        </div>
        
        <!-- Delete Tab -->
        <div id="delete-tab" class="tab-content">
            <div class="delete-form">
                <h2 style="margin-bottom: 20px; color: #856404;">Delete Nifty Data</h2>
                
                <div class="form-row">
                    <div>
                        <label for="delete-date">Date to Delete * (YYYY-MM-DD)</label>
                        <input type="date" id="delete-date" required>
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn-danger" onclick="deleteData()">🗑️ Delete Record</button>
                    <button class="btn-secondary" onclick="clearDeleteForm()">Clear</button>
                </div>
            </div>
            
            <div id="delete-results"></div>
        </div>
    </div>
    
    <script>
        const GRAPHQL_URL = '/graphql';
        
        const presets = {
            latest: `query {
  niftyData(limit: 10) {
    name
    date
    price
    open
    high
    low
    close
    volume
    changePercent
  }
}`,
            dateRange: `query {
  niftyData(startDate: "2025-12-01", endDate: "2025-12-04") {
    name
    date
    price
    open
    high
    low
    close
    volume
    changePercent
  }
}`,
            count: `query {
  niftyDataCount
}`,
            singleDate: `query {
  niftyDataByDate(date: "2025-12-04") {
    name
    date
    price
    open
    high
    low
    close
    volume
    changePercent
  }
}`
        };
        
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }
        
        function setPreset(presetName) {
            document.getElementById('query').value = presets[presetName];
        }
        
        async function executeQuery() {
            let query = document.getElementById('query').value.trim();
            const resultsDiv = document.getElementById('results');
            const indexFilter = document.getElementById('index-select').value.trim();
            
            if (!query) {
                resultsDiv.innerHTML = '<div class="error">Please enter a GraphQL query</div>';
                return;
            }

            // If an index filter is selected and the query has niftyData(...) without name:, inject name: "..."
            if (indexFilter) {
                const hasNameArg = /niftyData\s*\([^)]*name\s*:/;
                if (query.includes('niftyData(') && !hasNameArg.test(query)) {
                    query = query.replace(/niftyData\s*\(/, match => `${match}name: "${indexFilter}", `);
                }
            }
            
            resultsDiv.innerHTML = '<div class="loading">⏳ Executing query...</div>';
            
            try {
                const response = await fetch(GRAPHQL_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                if (data.errors) {
                    resultsDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${data.errors[0].message}</div>`;
                    return;
                }
                
                displayResults(data.data);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${error.message}</div>`;
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            // Handle count query
            if (data.niftyDataCount !== undefined) {
                resultsDiv.innerHTML = `
                    <div class="stats">
                        <div class="stat-card">
                            <div class="label">Total Records</div>
                            <div class="value">${data.niftyDataCount.toLocaleString()}</div>
                        </div>
                    </div>
                `;
                return;
            }
            
            // Handle single date query
            if (data.niftyDataByDate) {
                const item = data.niftyDataByDate;
                if (!item) {
                    resultsDiv.innerHTML = '<div class="error">No data found for the specified date</div>';
                    return;
                }
                displayTable([item], resultsDiv);
                return;
            }
            
            // Handle array of data
            const items = data.niftyData || [];
            
            if (items.length === 0) {
                resultsDiv.innerHTML = '<div class="error">No data found</div>';
                return;
            }
            
            displayTable(items, resultsDiv);
        }
        
        function displayTable(items, container) {
            const stats = `
                <div class="stats">
                    <div class="stat-card">
                        <div class="label">Records</div>
                        <div class="value">${items.length}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Date Range</div>
                        <div class="value">${items.length > 0 ? items[items.length - 1].date + ' to ' + items[0].date : 'N/A'}</div>
                    </div>
                </div>
            `;
            
            const table = `
                ${stats}
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Date</th>
                                <th>Price</th>
                                <th>Open</th>
                                <th>High</th>
                                <th>Low</th>
                                <th>Close</th>
                                <th>Volume</th>
                                <th>Change %</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${item.name || 'N/A'}</td>
                                    <td><strong>${item.date || 'N/A'}</strong></td>
                                    <td>${formatNumber(item.price ?? item.close)}</td>
                                    <td>${formatNumber(item.open)}</td>
                                    <td>${formatNumber(item.high)}</td>
                                    <td>${formatNumber(item.low)}</td>
                                    <td><strong>${formatNumber(item.close)}</strong></td>
                                    <td>${item.volume != null ? item.volume.toLocaleString('en-US') : 'N/A'}</td>
                                    <td>${item.changePercent != null ? item.changePercent.toFixed(2) + '%' : 'N/A'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            container.innerHTML = table;
        }
        
        function formatNumber(value) {
            if (value === null || value === undefined) return 'N/A';
            return parseFloat(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '<p style="text-align: center; color: #6c757d; padding: 40px;">Enter a query and click "Execute Query" to see results</p>';
        }
        
        async function upsertData() {
            const date = document.getElementById('insert-date').value;
            const open = document.getElementById('insert-open').value;
            const high = document.getElementById('insert-high').value;
            const low = document.getElementById('insert-low').value;
            const close = document.getElementById('insert-close').value;
            
            if (!date) {
                showInsertResult('error', 'Date is required');
                return;
            }
            
            const mutation = `mutation {
  upsertNiftyData(input: {
    date: "${date}"
    ${open ? `open: ${parseFloat(open)}` : ''}
    ${high ? `high: ${parseFloat(high)}` : ''}
    ${low ? `low: ${parseFloat(low)}` : ''}
    ${close ? `close: ${parseFloat(close)}` : ''}
  }) {
    success
    message
    data {
      date
      open
      high
      low
      close
    }
  }
}`;
            
            await executeMutation(mutation, 'insert-results');
        }
        
        async function createData() {
            const date = document.getElementById('insert-date').value;
            const open = document.getElementById('insert-open').value;
            const high = document.getElementById('insert-high').value;
            const low = document.getElementById('insert-low').value;
            const close = document.getElementById('insert-close').value;
            
            if (!date) {
                showInsertResult('error', 'Date is required');
                return;
            }
            
            const mutation = `mutation {
  createNiftyData(input: {
    date: "${date}"
    ${open ? `open: ${parseFloat(open)}` : ''}
    ${high ? `high: ${parseFloat(high)}` : ''}
    ${low ? `low: ${parseFloat(low)}` : ''}
    ${close ? `close: ${parseFloat(close)}` : ''}
  }) {
    success
    message
    data {
      date
      open
      high
      low
      close
    }
  }
}`;
            
            await executeMutation(mutation, 'insert-results');
        }
        
        async function updateData() {
            const date = document.getElementById('insert-date').value;
            const open = document.getElementById('insert-open').value;
            const high = document.getElementById('insert-high').value;
            const low = document.getElementById('insert-low').value;
            const close = document.getElementById('insert-close').value;
            
            if (!date) {
                showInsertResult('error', 'Date is required');
                return;
            }
            
            const mutation = `mutation {
  updateNiftyData(input: {
    date: "${date}"
    ${open ? `open: ${parseFloat(open)}` : ''}
    ${high ? `high: ${parseFloat(high)}` : ''}
    ${low ? `low: ${parseFloat(low)}` : ''}
    ${close ? `close: ${parseFloat(close)}` : ''}
  }) {
    success
    message
    data {
      date
      open
      high
      low
      close
    }
  }
}`;
            
            await executeMutation(mutation, 'insert-results');
        }
        
        async function deleteData() {
            const date = document.getElementById('delete-date').value;
            
            if (!date) {
                showDeleteResult('error', 'Date is required');
                return;
            }
            
            if (!confirm(`Are you sure you want to delete the record for ${date}?`)) {
                return;
            }
            
            const mutation = `mutation {
  deleteNiftyData(date: "${date}") {
    success
    message
  }
}`;
            
            await executeMutation(mutation, 'delete-results');
        }
        
        async function executeMutation(mutation, resultDivId) {
            const resultsDiv = document.getElementById(resultDivId);
            resultsDiv.innerHTML = '<div class="loading">⏳ Processing...</div>';
            
            try {
                const response = await fetch(GRAPHQL_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: mutation })
                });
                
                const data = await response.json();
                
                if (data.errors) {
                    showResult(resultDivId, 'error', `Error: ${data.errors[0].message}`);
                    return;
                }
                
                const result = data.data[Object.keys(data.data)[0]];
                
                if (result.success) {
                    showResult(resultDivId, 'success', result.message, result.data);
                } else {
                    showResult(resultDivId, 'error', result.message);
                }
            } catch (error) {
                showResult(resultDivId, 'error', `Error: ${error.message}`);
            }
        }
        
        function showResult(divId, type, message, data = null) {
            const resultsDiv = document.getElementById(divId);
            const className = type === 'success' ? 'success' : 'error';
            const icon = type === 'success' ? '✅' : '❌';
            
            let html = `<div class="${className}"><strong>${icon} ${message}</strong></div>`;
            
            if (data) {
                html += `
                    <div class="table-container" style="margin-top: 20px;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Date</th>
                                    <th>Price</th>
                                    <th>Open</th>
                                    <th>High</th>
                                    <th>Low</th>
                                    <th>Close</th>
                                    <th>Volume</th>
                                    <th>Change %</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>${data.name || 'N/A'}</td>
                                    <td><strong>${data.date || 'N/A'}</strong></td>
                                    <td>${formatNumber(data.price ?? data.close)}</td>
                                    <td>${formatNumber(data.open)}</td>
                                    <td>${formatNumber(data.high)}</td>
                                    <td>${formatNumber(data.low)}</td>
                                    <td><strong>${formatNumber(data.close)}</strong></td>
                                    <td>${data.volume != null ? data.volume.toLocaleString('en-US') : 'N/A'}</td>
                                    <td>${data.changePercent != null ? data.changePercent.toFixed(2) + '%' : 'N/A'}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
            
            resultsDiv.innerHTML = html;
        }
        
        function showInsertResult(type, message, data = null) {
            showResult('insert-results', type, message, data);
        }
        
        function showDeleteResult(type, message) {
            showResult('delete-results', type, message);
        }
        
        function clearInsertForm() {
            document.getElementById('insert-date').value = '';
            document.getElementById('insert-open').value = '';
            document.getElementById('insert-high').value = '';
            document.getElementById('insert-low').value = '';
            document.getElementById('insert-close').value = '';
            document.getElementById('insert-results').innerHTML = '';
        }
        
        function clearDeleteForm() {
            document.getElementById('delete-date').value = '';
            document.getElementById('delete-results').innerHTML = '';
        }
        
        // Allow Enter+Ctrl/Cmd to execute query
        document.getElementById('query').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                executeQuery();
            }
        });
